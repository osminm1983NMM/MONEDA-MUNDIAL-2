name: Checkpoint recuperable de remesas ficticias

on:
  push:
    branches:
      - feature/mwd-recovery-checkpoint-stage137-20261024
    paths:
      - 'src/server/mock-interrupted-transfer-recovery.mjs'
      - 'tests/mock-interrupted-transfer-recovery.test.mjs'
      - '.github/workflows/demo-recovery-checkpoint.yml'
  pull_request:

permissions:
  contents: read

jobs:
  recuperar-checkpoint-solo-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar serialización, restauración, idempotencia y cuentas separadas
        run: node --test tests/mock-interrupted-transfer-recovery.test.mjs tests/mock-international-transfer-guard.test.mjs tests/mock-transfer-reconciliation.test.mjs
