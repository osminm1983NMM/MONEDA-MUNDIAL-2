name: Verificar consulta pública offline
on:
  pull_request:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'DemoTourScreen.js'
      - 'GuestReadinessPreviewScreen.js'
      - 'tests/guest-readiness-preview.test.mjs'
      - '.github/workflows/test-guest-readiness.yml'
  push:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'DemoTourScreen.js'
      - 'GuestReadinessPreviewScreen.js'
      - 'tests/guest-readiness-preview.test.mjs'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/guest-readiness-preview.test.mjs
      - run: node --test tests/*.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform android --output-dir dist
