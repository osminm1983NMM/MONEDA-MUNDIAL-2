name: Simular venta primaria Coin y comisiones
on:
  pull_request:
    paths:
      - 'src/digital-money/mock-coin-primary-sale.mjs'
      - 'tests/mock-coin-primary-sale.test.mjs'
      - '.github/workflows/test-mock-coin-primary-sale.yml'
  push:
    branches: [safety/demo-coin-treasury-primary-sale-20261023]
    paths:
      - 'src/digital-money/mock-coin-primary-sale.mjs'
      - 'tests/mock-coin-primary-sale.test.mjs'
      - '.github/workflows/test-mock-coin-primary-sale.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coin-issuer-sale-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mock-coin-primary-sale.test.mjs tests/mock-coin-digital-settlement.test.mjs tests/coin-market-demo.test.mjs tests/crypto-release-gates.test.mjs
