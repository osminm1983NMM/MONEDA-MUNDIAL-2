name: Verificar sesión de agente para retiro ficticio
on:
  pull_request:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/server/mock-agent-pickup-session.mjs'
      - 'src/server/mock-institutional-session-gateway.mjs'
      - 'tests/mock-agent-pickup-session.test.mjs'
      - '.github/workflows/test-mock-agent-pickup-session.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mock-agent-pickup-session.test.mjs
      - run: node --test tests/*.test.mjs
