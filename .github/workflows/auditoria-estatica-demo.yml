name: Auditoría estática DEMO (manual)
on:
  push:
    branches: [dev/cierre-android-20261125]
    paths: ['App.js', 'scripts/*.cjs', '.github/workflows/auditoria-estatica-demo.yml']
  workflow_dispatch:
  pull_request:
    paths:
      - 'App.js'
      - 'package.json'
      - 'app.json'
      - 'scripts/audit-demo-static.cjs'
      - 'scripts/audit-regression-safety.cjs'
      - 'scripts/test-*.cjs'
      - '.github/workflows/auditoria-estatica-demo.yml'
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar configuración y barreras básicas
        run: |
          node scripts/audit-demo-static.cjs
          node scripts/audit-regression-safety.cjs
          node --test scripts/test-*.cjs
