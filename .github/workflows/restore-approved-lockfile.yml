name: Recuperar lockfile de APK aprobada (una sola entrega)
on:
  push:
    branches: [dev/cierre-android-20261125]
    paths: ['.github/workflows/restore-approved-lockfile.yml']
permissions: {}
jobs:
  restore:
    if: github.repository == 'osminm1983NMM/MONEDA-MUNDIAL-2' && github.ref == 'refs/heads/dev/cierre-android-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Restore only the exact approved dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch=dev/cierre-android-20261125
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/contents/package.json?ref=$branch" --jq .sha)" = 375a3aaca4d646315cfb0dbe35a49a564f62bdba
          cd "$RUNNER_TEMP"
          gh api "repos/$GH_REPO/actions/artifacts/15136713259/zip" > approved.zip
          echo '8fb505e9236c1716ff82b2671763f53d189ad5b0973309fe9e88d6cb2d70c5d0  approved.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, hashlib, json, base64
          with zipfile.ZipFile("approved.zip") as z:
              assert z.namelist().count("package-lock.json") == 1
              data = z.read("package-lock.json")
          assert hashlib.sha256(data).hexdigest() == "37b19f7d4ae9eddaaa18cbe1a1c2277dce212bcab46df0e6ba325cbdef31159e"
          lock = json.loads(data)
          assert lock["lockfileVersion"] == 3 and lock["name"] == "moneda-mundial-2"
          with open("payload.json", "w") as out:
              json.dump({"message": "Version exact dependency lock from approved Android LAB artifact", "content": base64.b64encode(data).decode("ascii"), "branch": "dev/cierre-android-20261125"}, out)
          PY
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha)" = "$GITHUB_SHA"
          # Create-only API: no blob SHA supplied, therefore never overwrite an existing lockfile.
          gh api --method PUT "repos/$GH_REPO/contents/package-lock.json" --input payload.json --jq .commit.sha
          echo 'Exact approved lockfile versioned; no APK rebuild or external deployment requested.'
