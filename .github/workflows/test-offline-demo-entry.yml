name: Validar acceso al recorrido offline al iniciar
on:
  push:
    branches: [fix/offline-demo-entry-during-auth-loading-20261017]
    paths:
      - 'App.js'
      - '.github/workflows/test-offline-demo-entry.yml'
permissions:
  contents: read
jobs:
  android-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/demo-tour.test.mjs
      - run: CI=1 npx expo export --platform android --output-dir dist
