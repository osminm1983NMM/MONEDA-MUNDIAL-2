name: Android DEV APK (manual)
on:
  push:
    branches:
      - fix/swap-reconcile-offline
    paths:
      - .github/workflows/android-dev-apk.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/android-dev-apk.yml
  workflow_dispatch:
jobs:
  android-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify demo safeguards
        run: |
          npm install --no-audit --no-fund
          node --test tests/*.test.mjs
          node -e "const c=require('./app.json').expo; if(c.android.package!=='com.monedamundial.app.dev'||c.name!=='Moneda Mundial DEV') process.exit(1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build debug APK signed with Android debug key
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify debug APK signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
      - name: Upload signed DEV test APK
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-dev-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
