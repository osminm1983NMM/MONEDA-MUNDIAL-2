name: Revisar recuperación conversión Coin Digital DEMO
on:
  pull_request:
    paths:
      - 'src/digital-money/mock-coin-digital-settlement.mjs'
      - 'tests/mock-coin-digital-recovery.test.mjs'
      - '.github/workflows/test-mock-coin-digital-recovery.yml'
  push:
    branches: [safety/demo-coin-digital-safe-conversion-20261023]
    paths:
      - 'src/digital-money/mock-coin-digital-settlement.mjs'
      - 'tests/mock-coin-digital-recovery.test.mjs'
      - '.github/workflows/test-mock-coin-digital-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mock-coin-digital-recovery.test.mjs tests/mock-coin-digital-settlement.test.mjs tests/coin-to-digital-design.test.mjs tests/crypto-release-gates.test.mjs
