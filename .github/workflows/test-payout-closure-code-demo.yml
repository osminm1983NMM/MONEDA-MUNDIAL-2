name: Verificar cierre de entrega DEMO con código consumido
on:
  push:
    branches: [fix/cierre-retiro-demo-20261017]
    paths:
      - 'database/mwd_payout_closure_requires_code_demo.sql'
      - 'tests/payout-closure-code-assertions.sql'
      - '.github/workflows/test-payout-closure-code-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cierre-codigo-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo-only
          POSTGRES_DB: payout_closure_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d payout_closure_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGDATABASE: payout_closure_test
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: demo-only
    steps:
      - uses: actions/checkout@v4
      - name: Preparar personas ficticias
        run: psql -X -v ON_ERROR_STOP=1 -f tests/partner-registry-fixture.sql
      - name: Cargar socios y remesas DEMO
        run: |
          psql -X -v ON_ERROR_STOP=1 -f database/mwd_secure_partner_registry_demo.sql
          psql -X -v ON_ERROR_STOP=1 -f database/mwd_owner_remittance_tracking_demo.sql
          psql -X -v ON_ERROR_STOP=1 -f database/mwd_payout_candidate_link_demo.sql
          psql -X -v ON_ERROR_STOP=1 -f database/mwd_beneficiary_code_security_demo.sql
          psql -X -v ON_ERROR_STOP=1 -f database/mwd_pickup_code_idempotency_demo.sql
          psql -X -v ON_ERROR_STOP=1 -f database/mwd_payout_closure_requires_code_demo.sql
      - name: Probar propietario, consumo e idempotencia
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-closure-code-assertions.sql
