name: Verificar remesa USA a Centroamérica SOLO LABORATORIO
on:
  pull_request:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'tests/mock-us-hn-ni-remittance-pickup-journey.test.mjs'
      - 'src/server/mock-cash-pickup-verification.mjs'
      - 'src/server/mock-agent-pickup-session.mjs'
      - 'src/server/mock-regulated-provider-bridge.mjs'
      - 'src/server/provider-integration-port.mjs'
      - 'src/server/mock-institutional-session-gateway.mjs'
      - '.github/workflows/test-mock-us-hn-ni-remittance-pickup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar envío y retiro falsos sin mover dinero
        run: node --test tests/mock-us-hn-ni-remittance-pickup-journey.test.mjs
      - name: Verificar contratos y seguridad de los módulos usados
        run: node --test tests/mock-regulated-provider-bridge.test.mjs tests/provider-integration-port.test.mjs tests/mock-cash-pickup-verification.test.mjs tests/mock-agent-pickup-session.test.mjs tests/mock-institutional-session-gateway.test.mjs
