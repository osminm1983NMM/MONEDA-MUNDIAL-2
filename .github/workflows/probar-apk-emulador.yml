name: Probar APK instalada en Android
on:
  workflow_dispatch:
# Manual only: trigger after a successful independent APK build for this exact
# commit. Do not auto-smoke an older artifact after an unrelated code push.
permissions:
  contents: read
  actions: read
jobs:
  apk-smoke:
    name: Instalar y abrir APK en emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Identificar APK aprobada del mismo commit que se prueba
        id: latest-apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api_path="repos/$GH_REPO/actions/workflows/android-apk-independiente.yml/runs?branch=desarrollo-comercios-20261013&status=success&per_page=1"
          result="$(gh api "$api_path")"
          run_id="$(echo "$result" | jq -r '.workflow_runs[0].id // empty')"
          build_sha="$(echo "$result" | jq -r '.workflow_runs[0].head_sha // empty')"
          if [ -z "$run_id" ] || [ -z "$build_sha" ]; then
            echo "::error::No hay APK independiente aprobada para probar"
            exit 1
          fi
          if [ "$build_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::La última APK aprobada ($build_sha) NO corresponde al commit actual ($EXPECTED_SHA). Compila esa versión antes de ejecutar la prueba en emulador."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"
          echo "APK de prueba: run $run_id, commit $build_sha"
          echo "Se verificará exclusivamente la APK de este mismo commit."
      - name: Obtener APK independiente aprobada
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.latest-apk.outputs.run_id }}
          name: moneda-mundial-2-demo-independiente
          path: apk-test
          github-token: ${{ github.token }}
      - name: Registrar procedencia de APK verificada
        run: |
          mkdir -p smoke-results
          echo "GitHub run: ${{ steps.latest-apk.outputs.run_id }}" > smoke-results/compilacion-probada.txt
          echo "Commit APK: ${{ steps.latest-apk.outputs.build_sha }}" >> smoke-results/compilacion-probada.txt
          echo "Commit esperado: ${{ github.sha }}" >> smoke-results/compilacion-probada.txt
      - name: Mostrar APK y comprobar integridad
        run: |
          ls -lh apk-test/
          unzip -l apk-test/app-release.apk | tail -n 5
      - name: Habilitar aceleración KVM para el emulador
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::El runner no ofrece KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Ejecutar Android en emulador sin credenciales
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/probar-apk-emulador.sh
      - name: Guardar resultados de arranque
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-android-smoke-test
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
