name: APK Android de demostración

on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo-comercios-20261013
    paths:
      - '*.js' # Incluye App.js y las pantallas administrativas del directorio raíz.
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/android-apk-debug.yml'

permissions:
  contents: read

jobs:
  apk-android:
    name: Compilar APK Android de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar Expo
        run: npx expo install --check
      - name: Generar proyecto nativo Android
        run: CI=1 npx expo prebuild --platform android --no-install --non-interactive
      - name: Compilar aplicación de prueba (sin firma de publicación)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-2-android-demo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
