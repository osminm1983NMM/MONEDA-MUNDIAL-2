name: APK Android de demostración

on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo-comercios-20261013
    paths:
      - '*.js' # Incluye App.js y las pantallas administrativas del directorio raíz.
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/android-apk-debug.yml'

permissions:
  contents: read

# Solo mantener la ejecución más reciente de esta compilación en la rama.
# Evita que pruebas de APK antiguas compitan por recursos con la versión vigente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-android:
    name: Compilar APK Android de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar Expo
        run: npx expo install --check
      - name: Generar proyecto nativo Android
        run: CI=1 npx expo prebuild --platform android --no-install --non-interactive
      # Instalar el mismo NDK que utiliza con éxito la APK independiente.
      # Sin instalación anticipada, Gradle puede fallar al bajar el SDK durante
      # su propia configuración (InstallFailedException: ndk;27.1.12297006).
      - name: Preparar NDK Android con reintentos
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager no está disponible"
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION"; then
              if [ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
                echo "NDK instalado correctamente en intento $attempt"
                break
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::No se pudo instalar NDK luego de 3 intentos"
              exit 1
            fi
            echo "::warning::Descarga incompleta del NDK; reintentando"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 20
          done
      - name: Compilar aplicación de prueba (sin firma de publicación)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-2-android-demo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
