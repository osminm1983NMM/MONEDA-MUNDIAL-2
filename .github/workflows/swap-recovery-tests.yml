name: Swap recovery tests
on:
  push:
    branches:
      - fix/swap-reconcile-offline
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run recovery unit tests
        run: node --test tests/*.test.mjs
