name: Verificar reclamaciones de clientes MOCK
on:
  pull_request:
    paths:
      - 'src/server/mock-customer-claims-desk.mjs'
      - 'src/server/mock-payment-lifecycle.mjs'
      - 'tests/mock-customer-claims-desk.test.mjs'
      - 'tests/mock-payment-lifecycle.test.mjs'
      - '.github/workflows/test-mock-customer-claims.yml'
  push:
    branches:
      - safety/demo-customer-claims-desk-20261022
      - safety/demo-refund-two-failures-hard-stop-20261023
    paths:
      - 'src/server/mock-customer-claims-desk.mjs'
      - 'src/server/mock-payment-lifecycle.mjs'
      - 'tests/mock-customer-claims-desk.test.mjs'
      - 'tests/mock-payment-lifecycle.test.mjs'
      - '.github/workflows/test-mock-customer-claims.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mock-customer-claims-desk.test.mjs tests/mock-payment-lifecycle.test.mjs
