name: Validate Android JS bundle (demo)
on:
  push:
    branches:
      - feature/remesas-demo-ui
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo configuration
        run: npx expo config --type public
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/mwd-android-export
