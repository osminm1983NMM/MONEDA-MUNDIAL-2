name: Validar idiomas DEMO
on:
  push:
    branches: ['mejora/idiomas-automaticos-demo-20261016']
  pull_request:
    paths: ['i18n.js','tests/i18n.test.cjs','App.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/i18n.test.cjs
