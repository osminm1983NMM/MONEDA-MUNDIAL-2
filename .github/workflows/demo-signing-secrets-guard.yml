name: Bloquear secretos de firma Android en código DEMO

on:
  push:
    branches:
      - feature/mwd-signing-secrets-guard-stage134-20261024
    paths:
      - '.gitignore'
      - 'scripts/proteger-claves-firma-android.mjs'
      - 'tests/android-signing-secrets-guard.test.mjs'
      - '.github/workflows/demo-signing-secrets-guard.yml'
      - '.github/workflows/demo-android-emulator-exact-commit.yml'
  pull_request:

permissions:
  contents: read

jobs:
  proteger-claves-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar patrones de bloqueo de archivos privados
        run: node --test tests/android-signing-secrets-guard.test.mjs
      - name: Revisar rutas y marcadores de claves en todos los archivos Git
        run: node scripts/proteger-claves-firma-android.mjs
