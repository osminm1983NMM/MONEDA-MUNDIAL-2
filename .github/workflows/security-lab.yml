name: Seguridad Moneda Mundial LAB

on:
  push:
    branches:
      - dev/recuperacion-transferencias
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-static:
    name: Verificaciones estáticas (sin dinero real)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar verificaciones
        run: node --test tests/security-static.test.cjs
