name: Seguridad Moneda Mundial LAB

on:
  push:
    branches:
      - dev/recuperacion-transferencias
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: security-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-static:
    name: Verificaciones estáticas (sin dinero real)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar verificaciones
        run: npm test

  expo-config:
    name: Validar configuración Expo (sin generar APK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias del laboratorio
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validar configuración pública de Expo
        run: npx expo config --type public
      - name: Verificar compatibilidad de dependencias con Expo SDK
        run: npx expo install --check
