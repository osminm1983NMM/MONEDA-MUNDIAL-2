name: Verificar pantalla de proveedores de investigación
on:
  pull_request:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/digital-money/provider-research-overview.mjs'
      - 'src/digital-money/provider-research-copy.mjs'
      - 'tests/provider-research-copy.test.mjs'
      - 'ProviderResearchScreen.js'
      - 'src/digital-money/worldwide-research-countries.mjs'
      - 'tests/worldwide-research-countries.test.mjs'
      - 'App.js'
      - 'tests/provider-research-overview.test.mjs'
      - '.github/workflows/test-provider-research-ui.yml'
  push:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/digital-money/provider-research-overview.mjs'
      - 'src/digital-money/provider-research-copy.mjs'
      - 'tests/provider-research-copy.test.mjs'
      - 'ProviderResearchScreen.js'
      - 'App.js'
      - 'tests/provider-research-overview.test.mjs'
      - '.github/workflows/test-provider-research-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/provider-research-overview.test.mjs
      - run: node --test tests/*.test.mjs
  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform android --output-dir dist
