name: Verificar historial MWD paginado DEMO
on:
  pull_request:
    paths:
      - 'App.js'
      - 'PagedDemoHistoryScreen.js'
      - 'src/demo-history-readonly.mjs'
      - 'tests/demo-history-readonly.test.mjs'
      - '.github/workflows/demo-history-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-readonly-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/demo-history-readonly.test.mjs
