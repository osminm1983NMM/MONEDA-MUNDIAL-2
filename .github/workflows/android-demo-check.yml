name: Verificar Android demo (sin APK)
on:
  push:
    branches:
      - 'mejora/conversion-coin-estable-demo-20261016'
      - 'integracion/demo-unificada-20261016'
  pull_request:
    paths:
      - '*.js'
      - 'src/digital-money/demo-asset-summary.mjs'
      - 'tests/demo-asset-summary.test.mjs'
      - 'src/digital-money/demo-conversion-contract.mjs'
      - 'tests/demo-conversion-contract.test.mjs'
      - 'src/digital-money/demo-pending-confirmation.mjs'
      - 'tests/demo-pending-confirmation.test.mjs'
      - 'src/digital-money/demo-confirm-and-reconcile.mjs'
      - 'tests/demo-confirm-and-reconcile.test.mjs'
      - 'src/digital-money/demo-session-guard.mjs'
      - 'tests/demo-session-guard.test.mjs'
      - 'src/digital-money/mwd-operation-status-demo.mjs'
      - 'tests/mwd-operation-status-demo.test.mjs'
      - 'src/digital-money/mwd-pending-operation-demo.mjs'
      - 'tests/mwd-pending-operation-demo.test.mjs'
      - 'src/digital-money/mwd-pending-recovery-demo.mjs'
      - 'tests/mwd-pending-recovery-demo.test.mjs'
      - 'tests/mwd-recovery-identity.test.mjs'
      - 'tests/mwd-two-accounts-sandbox.test.mjs'
      - 'scripts/android_launcher_anr.py'
      - 'tests/test_android_launcher_anr.py'
      - 'package.json'
      - 'app.json'
      - 'eas.json'
      - '.github/workflows/android-demo-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-android-bundle:
    name: Validar paquete JavaScript Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      REAL_PAYMENTS_ENABLED: 'false'
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Node.js 22 compatible con Expo SDK 54
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar configuración Expo
        run: npx expo config --type public --json > /tmp/expo-config.json
      - name: Verificar compatibilidad de dependencias
        run: npx expo install --check
      - name: Comprobar clasificación segura de ANR Android
        run: python3 -m unittest discover -s tests -p 'test_android_launcher_anr.py'
      - name: Validar cotizaciones y recibos solo de prueba
        run: node --test tests/demo-conversion-contract.test.mjs
      - name: Comprobar recuperación de confirmaciones tras una desconexión
        run: node --test tests/demo-pending-confirmation.test.mjs
      - name: Exigir conciliación del recibo antes de liberar saldo DEMO
        run: node --test tests/demo-confirm-and-reconcile.test.mjs
      - name: Validar datos y presentación de Coin y Digital (DEMO)
        run: node --test tests/demo-asset-summary.test.mjs
      - name: Verificar aislamiento de cuentas y respuestas obsoletas
        run: node --test tests/demo-session-guard.test.mjs
      - name: Validar estado de operaciones MWD sin mover saldos
        run: node --test tests/mwd-operation-status-demo.test.mjs
      - name: Verificar referencias persistentes MWD ficticias
        run: node --test tests/mwd-pending-operation-demo.test.mjs
      - name: Verificar recuperación idempotente MWD ante fallas
        run: node --test tests/mwd-pending-recovery-demo.test.mjs
      - name: Verificar identidad y recuperación con red simulada
        run: node --test tests/mwd-recovery-identity.test.mjs
      - name: Simular dos cuentas MWD e idempotencia sin dinero real
        run: node --test tests/mwd-two-accounts-sandbox.test.mjs
      - name: Empaquetar JavaScript para Android (no crea APK)
        run: npx expo export --platform android --output-dir dist
      - name: Confirmar que se generaron archivos
        run: test -d dist && test "$(find dist -type f | wc -l)" -gt 0
