name: Verificar recuperación Coin Digital DEMO
on:
  pull_request:
    paths:
      - 'src/digital-money/demo-pending-reconcile-readonly.mjs'
      - 'CoinStableDemoScreen.js'
      - 'tests/demo-pending-reconcile-readonly.test.mjs'
      - '.github/workflows/demo-pending-reconcile-readonly.yml'
  push:
    branches: [safety/demo-recovery-readonly-session-fence-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
