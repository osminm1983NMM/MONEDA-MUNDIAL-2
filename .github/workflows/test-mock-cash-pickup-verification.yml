name: Verificar retiro con código único SOLO MOCK
on:
  pull_request:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/server/mock-cash-pickup-verification.mjs'
      - 'tests/mock-cash-pickup-verification.test.mjs'
      - '.github/workflows/test-mock-cash-pickup-verification.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mock-cash-pickup-verification.test.mjs
      - run: node --test tests/*.test.mjs
