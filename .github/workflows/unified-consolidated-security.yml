name: Unified LAB consolidated security APK
on:
  push:
    branches: [dev/unified-lab-secure-lock-20261127]
    paths: ['.github/workflows/unified-consolidated-security.yml', 'package.json', 'package-lock.json']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/financial/unified-lab-stage.test.cjs
      - name: Stage isolated LAB in disposable checkout
        run: node scripts/stage-unified-lab.cjs --disposable-checkout
      - name: Verify committed dependency lock
        run: echo '0ae8b0e1da1d9147ce0a04f3eb2fd757a416611fdbdcb702457a72a9cb2ffdc3  package-lock.json' | sha256sum -c -
      - run: npm ci --no-audit --no-fund --engine-strict
      - name: Require zero reported npm dependency vulnerabilities
        run: |
          set -euo pipefail
          npm audit --package-lock-only --omit=dev --audit-level=low --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/audit.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/audit.json");if(r.error||r.metadata?.vulnerabilities?.total!==0)throw Error("AUDIT_NOT_CLEAR");console.log(r.metadata.vulnerabilities)'
      - run: npx expo install --check
      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/mwd-unified-export

  apk:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage independent unified LAB before dependencies
        run: node scripts/stage-unified-lab.cjs --disposable-checkout
      - name: Verify committed dependency lock
        run: echo '0ae8b0e1da1d9147ce0a04f3eb2fd757a416611fdbdcb702457a72a9cb2ffdc3  package-lock.json' | sha256sum -c -
      - run: npm ci --no-audit --no-fund --engine-strict
      - name: Require zero reported npm dependency vulnerabilities
        run: |
          set -euo pipefail
          npm audit --package-lock-only --omit=dev --audit-level=low --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/audit.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/audit.json");if(r.error||r.metadata?.vulnerabilities?.total!==0)throw Error("AUDIT_NOT_CLEAR");console.log(r.metadata.vulnerabilities)'
      - run: npx expo install --check
      - run: npx expo prebuild --platform android --no-install
      - name: Build development-signed APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$tools/aapt"
          test -x "$tools/apksigner"
          "$tools/aapt" dump badging "$apk" > /tmp/unified-badging.txt
          grep -F "package: name='com.monedamundial.unifiedlab'" /tmp/unified-badging.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk" > /tmp/unified-signature.txt
          mkdir -p unified-artifact
          cp "$apk" unified-artifact/MonedaMundial-LAB-Unificado.apk
          cp /tmp/unified-badging.txt /tmp/unified-signature.txt unified-artifact/
          git rev-parse HEAD > unified-artifact/revision.txt
          echo '0ae8b0e1da1d9147ce0a04f3eb2fd757a416611fdbdcb702457a72a9cb2ffdc3  package-lock.json' | sha256sum -c -
          sha256sum package-lock.json > unified-artifact/dependency-lock.sha256
          cp "$RUNNER_TEMP/audit.json" unified-artifact/npm-audit.json
          (cd unified-artifact && sha256sum MonedaMundial-LAB-Unificado.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: MonedaMundial-LAB-Unificado-consolidated-security
          path: unified-artifact/
          retention-days: 7
          if-no-files-found: error

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MonedaMundial-LAB-Unificado-consolidated-security
          path: ${{ runner.temp }}/unified-apk
      - name: Verify provenance, package, signature and architectures
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unified-apk"
          test "$(cat revision.txt)" = "$GITHUB_SHA"
          sha256sum -c SHA256SUMS
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose MonedaMundial-LAB-Unificado.apk
          "$tools/aapt" dump badging MonedaMundial-LAB-Unificado.apk > "$RUNNER_TEMP/unified-badging.txt"
          grep -F "package: name='com.monedamundial.unifiedlab'" "$RUNNER_TEMP/unified-badging.txt"
          grep '^native-code:' "$RUNNER_TEMP/unified-badging.txt" | grep -F "'x86_64'" | grep -F "'arm64-v8a'"
      - name: Test both modes and visible build identity
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sudo chmod 666 /dev/kvm
          image='system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/unified-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n unifiedlab -k "$image" --force
          "$ANDROID_HOME/emulator/emulator" -avd unifiedlab -port 5554 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim >"$RUNNER_TEMP/unified-emulator.log" 2>&1 &
          trap 'adb -s emulator-5554 emu kill || true' EXIT
          timeout 480 adb -s emulator-5554 wait-for-device
          timeout 600 bash -c 'until adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r" | grep -qx 1; do sleep 3; done'
          python3 scripts/smoke-unified-lab.py --serial emulator-5554 --artifact "$RUNNER_TEMP/unified-apk" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unified-emulator-diagnostics
          path: |
            ${{ runner.temp }}/unified-emulator.log
            ${{ runner.temp }}/unified-badging.txt
          if-no-files-found: ignore
          retention-days: 7
