name: Coin DEMO evaluar liquidez y riesgos
on:
  pull_request:
    paths:
      - 'src/digital-money/coin-liquidity-risk-demo.mjs'
      - 'tests/coin-liquidity-risk-demo.test.mjs'
      - '.github/workflows/test-coin-liquidity-risk-demo.yml'
  push:
    branches: [safety/demo-coin-liquidity-stress-20261023]
    paths:
      - 'src/digital-money/coin-liquidity-risk-demo.mjs'
      - 'tests/coin-liquidity-risk-demo.test.mjs'
      - '.github/workflows/test-coin-liquidity-risk-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  liquidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/coin-liquidity-risk-demo.test.mjs tests/coin-pool-impact-demo.test.mjs tests/coin-launch-economics.test.mjs
