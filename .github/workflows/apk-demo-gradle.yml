name: APK Android de demostración (Gradle)
on:
  push:
    branches: [fix/eas-build-current-ref-20261121]
    paths: ['.github/workflows/apk-demo-gradle.yml', 'App.js', 'PartnerRegistryScreen.js', 'app.json', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: node scripts/preflight-release-local.js
      - run: npx expo prebuild --platform android --no-install
      - name: Compilar con JavaScript incluido y firma de desarrollo
        working-directory: android
        run: bash gradlew :app:assembleRelease --max-workers=2
      - name: Preparar descarga
        run: |
          mkdir entrega
          cp android/app/build/outputs/apk/release/app-release.apk entrega/MonedaMundial-demo.apk
          cd entrega
          sha256sum MonedaMundial-demo.apk > SHA256.txt
          echo "$GITHUB_SHA" > COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MonedaMundial-demo-Samsung
          path: entrega/
          retention-days: 7
