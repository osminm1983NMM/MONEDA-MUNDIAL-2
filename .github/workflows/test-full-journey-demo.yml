name: Verificar recorrido completo DEMO
on:
  pull_request:
    branches: [desarrollo-comercios-20261013, main]
    paths:
      - 'src/digital-money/full-journey-demo.mjs'
      - 'tests/full-journey-demo.test.mjs'
      - 'FullMoneyJourneyScreen.js'
      - 'App.js'
      - '.github/workflows/test-full-journey-demo.yml'
  push:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/digital-money/full-journey-demo.mjs'
      - 'tests/full-journey-demo.test.mjs'
      - 'FullMoneyJourneyScreen.js'
      - 'App.js'
      - '.github/workflows/test-full-journey-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/full-journey-demo.test.mjs
      - run: node --test tests/*.test.mjs
  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform android --output-dir dist
