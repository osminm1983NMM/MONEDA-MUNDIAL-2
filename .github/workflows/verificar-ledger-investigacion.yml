name: Libro mayor aislado de investigacion
on:
  push:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'research/ledger/**'
      - '.github/workflows/verificar-ledger-investigacion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger-postgres-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ledger-ci-fixture-only
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: ledger_test
      PGUSER: postgres
      PGPASSWORD: ledger-ci-fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Crear roles cliente ficticios para aislamiento
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Instalar esquema aislado sin fondos
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/postgres-double-entry-research.sql
      - name: Probar partida doble y conciliación ficticia
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/tests/ledger-assertions.sql
      - name: Crear inbox transaccional ficticio
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/durable-mock-inbox.sql
      - name: Probar persistencia y anti-duplicación
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/tests/durable-mock-inbox-assertions.sql
      - name: Evento previo y fallo transaccional
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/tests/recovery-first-session.sql
      - name: Recuperación en sesión PostgreSQL nueva
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/tests/recovery-second-session.sql
      - name: Dos clientes PostgreSQL concurrentes - solo laboratorio
        run: bash research/ledger/tests/concurrency-two-clients.sh
      - name: Recuperación tras aborto forzado en transacción
        run: bash research/ledger/tests/forced-transaction-rollback.sh
      - name: Backup y restauración en base PostgreSQL desechable separada
        run: bash research/ledger/tests/backup-restore-isolated.sh
      - name: Preparar permisos de bancos y agentes ficticios con RLS
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/mock-partner-access-rls.sql
      - name: Verificar aislamiento multi-entidad y bitácora de prueba
        run: psql -X -v ON_ERROR_STOP=1 -f research/ledger/tests/mock-partner-access-rls-assertions.sql
