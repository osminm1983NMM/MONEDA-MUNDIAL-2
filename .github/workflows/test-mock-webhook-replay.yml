name: Probar replay de webhooks DEMO
on:
  pull_request:
    branches: [desarrollo-comercios-20261013, main]
    paths:
      - 'src/server/mock-provider-security-gateway.mjs'
      - 'src/server/mock-provider-event-mapper.mjs'
      - 'tests/mock-provider-security-gateway.test.mjs'
      - '.github/workflows/test-mock-webhook-replay.yml'
  push:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/server/mock-provider-security-gateway.mjs'
      - 'src/server/mock-provider-event-mapper.mjs'
      - 'tests/mock-provider-security-gateway.test.mjs'
      - '.github/workflows/test-mock-webhook-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mock-provider-security-gateway.test.mjs
      - run: node --test tests/*.test.mjs
