name: Validar Moneda Mundial DEMO

# Pruebas automáticas ligeras en PR (incluye todas las auditorías) y ejecución manual.
on:
  pull_request:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'eas.json'
      - 'tests/**'
      - 'audits/**'
      - '.github/workflows/validar-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacion:
    name: Sintaxis y controles DEMO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener rama
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Run dependency-free checks first to fail quickly and avoid unnecessary installs.
      - name: Verificar sintaxis de package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
      - name: Ejecutar todas las pruebas del proyecto
        run: npm test
      # La instalación/compilación Android se valida por separado para no gastar minutos en cada cambio.
  
  
