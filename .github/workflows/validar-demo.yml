name: Validar Moneda Mundial DEMO
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validacion:
    name: Configuración y exportación Android DEMO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de referencias pendientes
        run: node --test tests/android/*.test.cjs
      - name: Auditorías estáticas y recuperación funcional
        run: |
          node scripts/audit-demo-static.cjs
          node scripts/audit-regression-safety.cjs
          node scripts/preflight-release-local.js
          node --test scripts/test-transfer-recovery.cjs scripts/test-conversion-retiro.cjs scripts/test-demo-sql-runner.cjs
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validar configuración
        run: |
          node -e "const a=require('./app.json').expo,e=require('./eas.json'),p=require('./package.json'); if(!a.android.package || !a.extra.eas.projectId || e.build.preview.android.buildType!=='apk' || !p.dependencies.expo) process.exit(1)"
          npx expo install --check
      - name: Exportar JavaScript Android
        run: npx expo export --platform android --output-dir dist-validation
