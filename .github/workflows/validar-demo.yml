name: Validar Moneda Mundial DEMO

# Validacion de PR autorizada por el propietario el 2026-11-16.
# Sin build EAS ni despliegue. Solo validacion automatica.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validacion:
    name: Configuracion y controles de demostracion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener rama seleccionada
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar archivos JSON
        run: |
          node -e "for (const f of ['package.json','app.json','eas.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
      - name: Ejecutar pruebas estaticas Android y APK
        run: npm run test:demo
      - name: Instalar dependencias para validar Expo
        run: npm install --no-audit --no-fund
      - name: Validar configuracion publica de Expo
        run: npx expo config --type public
