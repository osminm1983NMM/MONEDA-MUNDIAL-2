name: Validar Moneda Mundial DEMO

# Ejecución manual únicamente. No se activa con cada commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacion:
    name: Sintaxis y controles DEMO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener rama
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Run dependency-free checks first to fail quickly and avoid unnecessary installs.
      - name: Verificar sintaxis de package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
      - name: Comprobar protecciones de recuperación e idempotencia
        run: node --test tests/operation-recovery-static.test.cjs
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
  
  
