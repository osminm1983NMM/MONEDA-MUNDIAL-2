name: Preserve zero-findings LAB lock
on:
  push:
    branches: [qa/unified-dependency-audit-20261127]
    paths: ['.github/workflows/preserve-zero-findings-lock.yml']
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/unified-lab-secure-lock-20261127
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: moderate-dependency-trial
          run-id: 46083373796
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reviewed
      - name: Preserve exactly reviewed manifest and lock in isolated branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c547a9ec45329876108b0c5b1b22c7a8b1ca5aed
          test "$(git branch --show-current)" = dev/unified-lab-secure-lock-20261127
          test -z "$(git status --porcelain)"
          echo '3628669bbf8d74963029e9a4fdcb0f9c0b981302be004dfc59b2147e579074d5  package.json' | sha256sum -c -
          echo '3962eeee930022e112ec65bbef5dbf55291587008f55434574642fb4dcf11c86  package-lock.json' | sha256sum -c -
          cd "$RUNNER_TEMP/reviewed"
          echo '02151eedf57d1876dd599bf5c1816ad02fd84bee5897a3b6a71153d3647de65e  candidate-package.json' | sha256sum -c -
          echo '0ae8b0e1da1d9147ce0a04f3eb2fd757a416611fdbdcb702457a72a9cb2ffdc3  candidate-lock.json' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/reviewed/candidate-package.json" package.json
          cp "$RUNNER_TEMP/reviewed/candidate-lock.json" package-lock.json
          git add -- package.json package-lock.json
          test "$(git diff --cached --name-only | sort | paste -sd, -)" = package-lock.json,package.json
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): preserve reviewed glob and minimatch dependency lock'
          git push origin HEAD:refs/heads/dev/unified-lab-secure-lock-20261127
          git rev-parse HEAD
