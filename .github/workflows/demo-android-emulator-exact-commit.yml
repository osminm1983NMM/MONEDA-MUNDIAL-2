name: APK Android DEMO Etapa 129 con firma auditada y emulador

on:
  push:
    branches:
      - feature/mwd-visual-modernization-stage126-20261024
      - feature/mwd-apk-signature-guard-stage128-20261024
      - feature/mwd-history-consistent-pagination-stage129-20261024
      - feature/mwd-android-version-guard-stage132-20261024
      - feature/mwd-apk-build-provenance-stage133-20261024
      - feature/mwd-signing-secrets-guard-stage134-20261024
      - feature/mwd-mobile-durable-retry-stage140
    paths:
      - '.github/workflows/demo-android-emulator-exact-commit.yml'
      - 'App.js'
      - 'DemoTourScreen.js'
      - 'DemoHistoryRecentScreen.js'
      - 'GuestHistoryPreviewScreen.js'
      - 'tests/**'
      - 'PagedDemoHistoryScreen.js'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'app.json'
  workflow_dispatch:

permissions:
  contents: read

# Solo mantener la ejecución más reciente de esta compilación en la rama.
# Evita que pruebas de APK antiguas compitan por recursos con la versión vigente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparar-apk-independiente:
    # Do not build untrusted fork PR code on the expensive Android runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Bloquear claves privadas y credenciales de firma versionadas
        run: node scripts/proteger-claves-firma-android.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar compatibilidad
        run: npx expo install --check
      - name: Verificar modelos y contrato del historial inventado
        run: |
          node --test tests/android-apk-signature-policy.test.mjs tests/android-apk-upgrade-policy.test.mjs tests/android-apk-version-match.test.mjs
          node --test tests/android-apk-provenance.test.mjs
          node --test tests/demo-pending-storage.test.mjs
          node tests/demo-history-readonly.test.mjs
          node tests/demo-history-view.test.mjs
          node tests/demo-history-guest-fixture.test.mjs
          python3 -m unittest discover -s tests -p 'test_android_history_preview_contract.py'
      - name: Generar proyecto Android
        run: CI=1 npx expo prebuild --platform android --no-install --non-interactive
      - name: Preparar NDK Android con reintentos
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager no está disponible"
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION"; then
              if [ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
                echo "NDK instalado correctamente en intento $attempt"
                break
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::No se pudo instalar el NDK luego de 3 intentos"
              exit 1
            fi
            echo "::warning::El servidor SDK devolvió un archivo incompleto; reintentando"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 20
          done
      - name: Compilar APK independiente de demostración
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verificar paquete de JavaScript incorporado
        run: |
          unzip -Z1 android/app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle$'
      - name: Guardar APK independiente de demostración
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-2-demo-etapa129-independiente
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  smoke-android-emulator:
    name: Instalar la APK de este mismo commit y verificar arranque
    needs: preparar-apk-independiente
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Descargar artefacto APK creado en este mismo flujo
        uses: actions/download-artifact@v4
        with:
          name: moneda-mundial-2-demo-etapa129-independiente
          path: apk-test
      - name: Registrar procedencia de la prueba
        run: |
          mkdir -p smoke-results
          echo "Commit APK: ${{ github.sha }}" > smoke-results/compilacion-probada.txt
          echo "Run: ${{ github.run_id }}" >> smoke-results/compilacion-probada.txt
      - name: Registrar la huella SHA-256 de la APK exacta que se probará
        shell: bash
        run: |
          set -euo pipefail
          sha256sum apk-test/app-release.apk >smoke-results/sha256-apk-probada.txt
          cat smoke-results/sha256-apk-probada.txt
      - name: Auditar la firma Android y marcar explícitamente DEMO no publicable
        shell: bash
        run: |
          set -euo pipefail
          # Version estable del verificador, independiente del SDK más reciente
          # que pueda estar preinstalado en ubuntu-latest.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'build-tools;35.0.1'
          test -x "$SDK_ROOT/build-tools/35.0.1/apksigner"
          APKSIGNER_PATH="$SDK_ROOT/build-tools/35.0.1/apksigner" \
            node scripts/comprobar-firma-android.mjs apk-test/app-release.apk --demo | tee smoke-results/firma-apk-demo.txt
          test -s smoke-results/firma-apk-demo.txt
      - name: Confirmar paquete y versionCode reales de la APK contra app.json
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$SDK_ROOT/build-tools/35.0.1/aapt"
          AAPT_PATH="$SDK_ROOT/build-tools/35.0.1/aapt" \
            node scripts/comprobar-version-android-demo.mjs apk-test/app-release.apk app.json \
            | tee smoke-results/version-apk-demo.txt
          test -s smoke-results/version-apk-demo.txt
      - name: Registrar identidad del APK exacto con huellas y commit
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER_PATH="$SDK_ROOT/build-tools/35.0.1/apksigner" \
          AAPT_PATH="$SDK_ROOT/build-tools/35.0.1/aapt" \
            node scripts/registrar-identidad-apk-demo.mjs apk-test/app-release.apk app.json \
            | tee smoke-results/identidad-apk-demo.json
          test -s smoke-results/identidad-apk-demo.json
      # Habilitar KVM según la guía de reactivecircus/android-emulator-runner.
      # Sin aceleración hardware, el arranque puede tardar más de 15 minutos
      # y el sistema Android puede mostrar errores de falta de respuesta.
      - name: Habilitar aceleración KVM para el emulador
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::Este runner no ofrece KVM; no es apto para la prueba automatizada."
            exit 1
          fi
          # Evitar dependencia de udevadm en runners donde las reglas
          # no se pueden recargar. La aceleración existe si /dev/kvm
          # es accesible desde la cuenta que ejecuta el emulador.
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::No hay acceso KVM para este runner."
            exit 1
          fi
      - name: Emulador Android sin credenciales ni dinero real
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            bash scripts/probar-apk-emulador.sh
            bash scripts/probar-recorrido-invitado-emulador.sh
      # Solo llega aquí si instalar, abrir y recorrer la demo en el
      # emulador de este mismo commit ha terminado SIN errores.
      - name: Confirmar la huella y las evidencias del recorrido público
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check smoke-results/sha256-apk-probada.txt
          test -s smoke-results/identidad-apk-demo.json
          test -s smoke-results/ui.xml
          test -s smoke-results/guest-tour.xml
          test -s smoke-results/guest-tour-bottom.xml
          test -s smoke-results/guest-crypto.xml
          test -s smoke-results/guest-crypto-bottom.xml
          test -s smoke-results/guest-readiness.xml
          test -s smoke-results/guest-readiness-bottom.xml
          test -s smoke-results/guest-after-readiness.xml
          test -s smoke-results/guest-after-crypto.xml
          test -s smoke-results/guest-tour-return-ready.xml
          test -s smoke-results/guest-history-top.xml
          test -s smoke-results/guest-history-incoming-top.xml
          test -s smoke-results/guest-history-merchant-top.xml
          test -s smoke-results/guest-history-receipt-top.xml
          test -s smoke-results/guest-tour-after-history-bottom.xml
          test -s smoke-results/guest-return.xml
          echo "Run: ${{ github.run_id }}, commit: ${{ github.sha }}"
      - name: Guardar APK Android DEMO probada (NO PUBLICAR)
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-2-demo-etapa129-apk-emulador-no-publicar
          path: apk-test/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Guardar evidencias del arranque
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-etapa129-android-smoke-test
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
