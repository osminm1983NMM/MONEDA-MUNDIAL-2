name: Verificar transparencia remesas DEMO
on:
  pull_request:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/digital-money/remittance-disclosure-demo.mjs'
      - 'tests/remittance-disclosure-demo.test.mjs'
      - 'FullMoneyJourneyScreen.js'
      - '.github/workflows/test-remittance-disclosure.yml'
  push:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/digital-money/remittance-disclosure-demo.mjs'
      - 'tests/remittance-disclosure-demo.test.mjs'
      - 'FullMoneyJourneyScreen.js'
      - '.github/workflows/test-remittance-disclosure.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/remittance-disclosure-demo.test.mjs
      - run: node --test tests/*.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform android --output-dir dist
