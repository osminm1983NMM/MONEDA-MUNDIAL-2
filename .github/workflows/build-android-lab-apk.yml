name: Build Android LAB APK (demo only)
on:
  workflow_dispatch:
  push:
    branches:
      - dev/recuperacion-transferencias
    paths:
      - '.github/workflows/build-android-lab-apk.yml'
      - 'App.js'
      - 'PartnerRegistryScreen.js'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
      - 'tests/**'

concurrency:
  group: android-lab-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Descargar rama de laboratorio
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK preinstalado en GitHub Actions
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Instalar dependencias
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Ejecutar suite de pruebas antes de compilar
        run: npm test
      - name: Generar proyecto nativo Android
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Incluir bundle JavaScript para abrir APK sin servidor Metro
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          content = p.read_text()
          if 'react {' not in content:
              raise SystemExit('No se encontró bloque react en build.gradle')
          content = content.replace('react {', 'react {\n    debuggableVariants = [] // LAB: incrustar JavaScript en debug', 1)
          p.write_text(content)
          PY
      - name: Compilar APK debug instalable de demostración
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Comprobar que APK contiene bundle JS integrado
        shell: bash
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/index.android.bundle|assets/index.bundle'
      - name: Guardar APK y suma SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/moneda-mundial-lab-debug.apk
          (cd dist && sha256sum moneda-mundial-lab-debug.apk > SHA256SUMS.txt)
      - name: Publicar APK de laboratorio
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-lab-debug-${{ github.run_number }}
          path: dist/
          retention-days: 3
          if-no-files-found: error
