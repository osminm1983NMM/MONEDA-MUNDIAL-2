name: Revisar compra Coin sin duplicaciones DEMO
on:
  pull_request:
    paths:
      - 'src/digital-money/mock-coin-purchase-guard.mjs'
      - 'tests/mock-coin-purchase-guard.test.mjs'
      - '.github/workflows/test-mock-coin-purchase-guard.yml'
  push:
    branches: [safety/demo-coin-purchase-terms-duplicate-guard-20261023]
    paths:
      - 'src/digital-money/mock-coin-purchase-guard.mjs'
      - 'tests/mock-coin-purchase-guard.test.mjs'
      - '.github/workflows/test-mock-coin-purchase-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-coin-purchases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mock-coin-purchase-guard.test.mjs tests/mock-coin-primary-sale.test.mjs tests/coin-governance-prelaunch.test.mjs
