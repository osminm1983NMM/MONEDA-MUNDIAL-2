name: Comprobar autodiagnóstico de cuenta DEMO
on:
  pull_request:
    paths:
      - 'src/digital-money/demo-account-selfcheck.mjs'
      - 'App.js'
      - 'DemoAccountSelfcheckScreen.js'
      - 'src/digital-money/home-demo-i18n.mjs'
      - 'tests/demo-account-selfcheck-ui.test.mjs'
      - 'tests/demo-account-selfcheck.test.mjs'
      - '.github/workflows/demo-account-selfcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selfcheck-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REAL_PAYMENTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar aislamiento de cuenta con clientes simulados
        run: node --test tests/demo-account-selfcheck.test.mjs tests/demo-account-selfcheck-ui.test.mjs
      - name: Declarar alcance
        run: echo 'Los tests emplean clientes falsos. No se usan JWT reales, Supabase conectado ni dinero.'
