name: Security static checks
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free security regression checks
        run: node scripts/check-security-static.cjs
