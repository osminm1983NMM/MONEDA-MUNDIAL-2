name: APK Android independiente - pruebas

on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo-comercios-20261013
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/android-apk-independiente.yml'

permissions:
  contents: read

jobs:
  preparar-apk-independiente:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar compatibilidad
        run: npx expo install --check
      - name: Generar proyecto Android
        run: CI=1 npx expo prebuild --platform android --no-install --non-interactive
      - name: Compilar APK independiente de demostración
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verificar paquete de JavaScript incorporado
        run: |
          unzip -Z1 android/app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle$'
      - name: Guardar APK independiente de demostración
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-2-demo-independiente
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
