name: APK Android independiente - pruebas

on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo-comercios-20261013
    paths:
      - '*.js' # Incluye App.js y las pantallas administrativas del directorio raíz.
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/android-apk-independiente.yml'
      - '.github/workflows/probar-apk-emulador.yml' # Rebuild after modifying APK provenance checks.

permissions:
  contents: read

jobs:
  preparar-apk-independiente:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar compatibilidad
        run: npx expo install --check
      - name: Generar proyecto Android
        run: CI=1 npx expo prebuild --platform android --no-install --non-interactive
      - name: Preparar NDK Android con reintentos
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager no está disponible"
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION"; then
              if [ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
                echo "NDK instalado correctamente en intento $attempt"
                break
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::No se pudo instalar el NDK luego de 3 intentos"
              exit 1
            fi
            echo "::warning::El servidor SDK devolvió un archivo incompleto; reintentando"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 20
          done
      - name: Compilar APK independiente de demostración
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verificar paquete de JavaScript incorporado
        run: |
          unzip -Z1 android/app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle$'
      - name: Guardar APK independiente de demostración
        uses: actions/upload-artifact@v4
        with:
          name: moneda-mundial-2-demo-independiente
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
