name: Probar APK Samsung en Android
on:
  workflow_run:
    workflows: ['APK Android de demostración (Gradle)']
    branches: [dev/cierre-android-20261125]
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  instalar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recuperar la APK compilada para esta rama
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          run="$SOURCE_RUN"
          if [ -z "$run" ]; then
            run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$GITHUB_REF_NAME" -f status=success --jq '[.workflow_runs[] | select(.path == ".github/workflows/apk-demo-gradle.yml")][0].id // empty')
          fi
          test -n "$run"
          gh run download "$run" -n MonedaMundial-LAB-Samsung -D "$RUNNER_TEMP/apk"
          cd "$RUNNER_TEMP/apk"
          sha256sum -c SHA256.txt
          sha256sum -c DEPENDENCIES-SHA256.txt
          commit=$(cat COMMIT.txt)
          test "$commit" = "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          # Documentation may differ; any executable, dependency or configuration change requires a new APK.
          git -C "$GITHUB_WORKSPACE" diff --exit-code "$commit" HEAD -- . ':(exclude)docs/**'
          echo "MWD_EXPECTED_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Instalar y arrancar Android 35
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sudo chmod 666 /dev/kvm
          image='system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'platform-tools' "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n mwd -k "$image" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx mwd
          "$ANDROID_HOME/emulator/emulator" -avd mwd -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim >"$RUNNER_TEMP/emulator.log" 2>&1 &
          GITHUB_SHA="$MWD_EXPECTED_COMMIT" bash scripts/probar-apk-samsung.sh "$RUNNER_TEMP/apk/MonedaMundial-LAB.apk" || { status=$?; tail -50 "$RUNNER_TEMP/emulator.log"; exit "$status"; }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MonedaMundial-inicio-Android
          path: ${{ runner.temp }}/inicio.png
          retention-days: 7
