name: Integracion PostgreSQL aislada DEMO
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/postgres-*.sql'
      - 'tests/postgres-*.sh'
      - 'audits/wallet-opening-schema-proposal.sql'
      - 'audits/wallet-opening-trigger-integration-proposal.sql'
      - '.github/workflows/test-postgres-signup.yml'
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mwd_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar pruebas SQL contra PostgreSQL efimero
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-signup-integration.sql
      - name: Verificar alta concurrente en dos conexiones PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: bash tests/postgres-signup-concurrency.sh
      - name: Comprobar reversion de fallos y bloqueo de borrados
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-signup-failure-matrix.sql
      - name: Comprobar transferencias concurrentes y reintentos
        env:
          PGPASSWORD: test-only-password
        run: bash tests/postgres-transfer-concurrency.sh
      - name: Probar funcion de transferencia real en entorno sintetico
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-transfer-real-setup.sql
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-transfer-real-function.sql
          bash tests/postgres-real-transfer-concurrency.sh
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -c "DELETE FROM public.mwd_operations WHERE actor_id='00000000-0000-0000-0000-000000000040'; UPDATE public.mwd_wallets SET balance_cents=1000000 WHERE user_id IN ('00000000-0000-0000-0000-000000000040','00000000-0000-0000-0000-000000000041','00000000-0000-0000-0000-000000000042');"
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-transfer-real-check.sql
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-real-transfer-rollback.sql
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-owner-access-negative.sql
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-pickup-negative-model.sql
          bash tests/postgres-pickup-concurrency-model.sh
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-sim-pickup-real-function.sql
          bash tests/postgres-sim-pickup-real-concurrency.sh
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-sim-pickup-owner-negative.sql
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-sim-pickup-lockout-window.sql
          psql -h localhost -U postgres -d mwd_integration_test -v ON_ERROR_STOP=1 -f tests/postgres-sim-pickup-four-failure-boundary.sql
