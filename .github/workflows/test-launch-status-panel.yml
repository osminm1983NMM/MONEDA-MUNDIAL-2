name: Verificar panel lanzamiento DEMO
on:
  pull_request:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/digital-money/project-launch-status.mjs'
      - 'ProjectLaunchStatusScreen.js'
      - 'App.js'
      - 'tests/project-launch-status.test.mjs'
      - '.github/workflows/test-launch-status-panel.yml'
  push:
    branches: [desarrollo-comercios-20261013]
    paths:
      - 'src/digital-money/project-launch-status.mjs'
      - 'ProjectLaunchStatusScreen.js'
      - 'App.js'
      - 'tests/project-launch-status.test.mjs'
      - '.github/workflows/test-launch-status-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/project-launch-status.test.mjs
      - run: node --test tests/*.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform android --output-dir dist
