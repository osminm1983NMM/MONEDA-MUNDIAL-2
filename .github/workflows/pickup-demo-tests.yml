name: Verificar modulo retiro demo
on:
  push:
    branches: ['mejora/retiro-sin-app-demo-20261016','integracion/demo-unificada-20261016']
    paths: ['pickupDemoRules.js','tests/**','.github/workflows/pickup-demo-tests.yml']
  pull_request:
    paths: ['pickupDemoRules.js','tests/**','.github/workflows/pickup-demo-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pickup-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar entradas y estados sin claves ni conexión financiera
        run: node --test tests/pickupDemoRules.test.cjs
